# Machine-learning configuration. Change parameters here, not in code.

model_version: "0.1.0"
random_seed: 42

targets: [aqi, pm25, pm10]
horizons_hours: [24, 48, 72]

split:
  # Chronological split only. Shuffling would leak future data.
  chronological: true
  train_fraction: 0.80

validation:
  scheme: "time_series_split"
  cv_folds: 5

metrics: [mae, rmse, r2, mape]
# Candidate with the best value of this metric on held-out data is selected.
selection_metric: "rmse"

# Below this many training rows, training is refused and the clearly labelled
# baseline forecaster is used instead. No model is ever reported as trained
# when it was not.
min_training_rows: 720

artifacts_dir: "models"

candidates:
  persistence:
    enabled: true
    params: {}
  random_forest:
    enabled: true
    params:
      n_estimators: 300
      max_depth: 12
      min_samples_leaf: 3
      n_jobs: -1
  xgboost:
    enabled: true
    params:
      n_estimators: 500
      max_depth: 6
      learning_rate: 0.03
      subsample: 0.85
      colsample_bytree: 0.85
      min_child_weight: 3
      reg_alpha: 0.1
      reg_lambda: 1.0
      objective: "reg:squarederror"
      random_state: 42

features:
  historical_pollution: [aqi, pm25, pm10, no2, so2, co, o3]
  weather: [temperature, humidity, wind_speed, wind_direction, pressure, rainfall]
  activity_indices: [firecracker_activity, traffic_intensity, industrial_activity, construction_activity]
  temporal: [hour, day, month, day_of_week, diwali_proximity_days, days_since_diwali]
  lag_hours: [1, 3, 6, 12, 24]
  rolling_windows_hours: [6, 24]
